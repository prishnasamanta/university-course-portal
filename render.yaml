services:
  # Single Full-Stack Web Application Service on Render (UI + API)
  - type: web
    name: university-course-portal
    env: node
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DB_TYPE
        value: firebase
      - key: FIREBASE_PROJECT_ID
        value: university-reg-portal
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
